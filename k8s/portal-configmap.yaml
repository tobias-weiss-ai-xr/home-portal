apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-html
  namespace: home
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="de">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workplace Services</title>
    <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
    <header>
      <div class="container">
        <h1>Workplace Services</h1>
        <p>Zentrale Anlaufstelle für alle Dienste</p>
      </div>
    </header>

    <div class="container">
      <!-- Widgets Row -->
      <div class="widgets">
        <!-- WetterOnline Marburg -->
        <div class="widget">
          <h2>Wetter für Marburg</h2>
          <div class="wetteronline">
            <iframe src="https://www.wetteronline.de/cgi-bin/weathermap?city=MARBURG&country=DEU&lang=de&type=0" 
                    title="WetterOnline Marburg" loading="lazy"></iframe>
          </div>
        </div>
        <div class="widget">
          <h2>Tagesschau Top 10</h2>
          <ul id="rss-tagesschau">
            <li class="loading">Lade News...</li>
          </ul>
        </div>
      </div>

      <!-- Functions Grid -->
      <div class="func-grid">
        <div class="func-card">
          <h3>Authentifizierung &amp; SSO</h3>
          <p class="product">Keycloak</p>
          <a href="https://id.home.opendesk-edu.org">Login</a>
        </div>
        <div class="func-card">
          <h3>E-Mail &amp; Collaboration</h3>
          <p class="product">SOGo6</p>
          <a href="https://sogo6.home">Open</a>
        </div>
        <div class="func-card">
          <h3>Mail Server</h3>
          <p class="product">Stalwart</p>
          <a href="https://stalwart.home">Open</a>
        </div>
      </div>

      <!-- Admin Section (above footer) -->
      <div class="admin-section">
        <p>Administrator access:</p>
        <a href="https://admin.home.opendesk-edu.org">Admin Portal</a>
      </div>
    </div>

    <footer>
      <div class="container">
        <p>
          <a href="https://www.uni-marburg.de">Philipps-Universität Marburg</a> |
          <a href="https://www.hrz.uni-marburg.de">HRZ</a> |
          <a href="https://help.home.opendesk-edu.org">Help</a>
        </p>
      </div>
    </footer>

    <!-- Tagesschau RSS -->
    <script>
    const RSS_URL = 'https://www.tagesschau.de/export/rss2';
    const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
    async function fetchRSS() {
      try {
        const resp = await fetch(CORS_PROXY + encodeURIComponent(RSS_URL));
        const text = await resp.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'text/xml');
        const items = xml.querySelectorAll('item');
        const list = document.getElementById('rss-tagesschau');
        list.innerHTML = '';
        items.slice(0, 10).forEach(item => {
          const title = item.querySelector('title')?.textContent || '';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDate = item.querySelector('pubDate')?.textContent || '';
          const li = document.createElement('li');
          li.innerHTML = `<a href="${link}" target="_blank">${title}</a><span class="date">${pubDate}</span>`;
          list.appendChild(li);
        });
      } catch (e) {
        document.getElementById('rss-tagesschau').innerHTML = '<li class="error">News temporarily unavailable</li>';
      }
    }
    fetchRSS();
    </script>
    </body>
    </html>
  style.css: |
    :root {
      --bg: #FFFFFF;
      --card: #F5F5F5;
      --border: #E0E0E0;
      --text: #333333;
      --text-dim: #666666;
      --accent: #005CB9;
      --accent-hover: #E5732D;
      --footer-bg: #005CB9;
      --footer-text: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Helvetica Neue, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { background: var(--accent); color: white; padding: 30px 0; text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 28px; margin-bottom: 8px; }
    header p { opacity: 0.9; font-size: 16px; }
    .widgets { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .widget { background: var(--card); border-radius: 8px; padding: 20px; border: 1px solid var(--border); }
    .widget h2 { color: var(--accent); margin-bottom: 12px; font-size: 18px; }
    .func-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .func-card { background: var(--card); border-radius: 8px; padding: 20px; border: 1px solid var(--border); text-align: center; transition: transform 0.2s; }
    .func-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .func-card h3 { color: var(--accent); margin-bottom: 8px; font-size: 16px; }
    .func-card .product { color: var(--text-dim); font-size: 14px; font-style: italic; }
    .func-card a { display: block; margin-top: 12px; background: var(--accent); color: white; padding: 10px 16px; border-radius: 4px; text-decoration: none; font-weight: 500; }
    .func-card a:hover { background: var(--accent-hover); }
    .admin-section { text-align: center; margin: 40px 0 20px; padding: 20px; border-top: 1px solid var(--border); }
    .admin-section p { color: var(--text-dim); margin-bottom: 12px; }
    .admin-section a { color: var(--accent); text-decoration: none; font-weight: 500; }
    footer { background: var(--footer-bg); color: var(--footer-text); padding: 20px 0; text-align: center; font-size: 14px; }
    footer a { color: var(--footer-text); text-decoration: none; opacity: 0.8; }
    footer a:hover { opacity: 1; }
    .wetteronline iframe { width: 100%; height: 350px; border: none; border-radius: 4px; }
    #rss-tagesschau { list-style: none; padding: 0; }
    #rss-tagesschau li { padding: 8px 0; border-bottom: 1px solid var(--border); }
    #rss-tagesschau li:last-child { border-bottom: none; }
    #rss-tagesschau li a { color: var(--accent); text-decoration: none; }
    #rss-tagesschau li a:hover { text-decoration: underline; }
    #rss-tagesschau li .date { color: var(--text-dim); font-size: 12px; display: block; margin-top: 4px; }
    .loading, .error { color: var(--text-dim); font-style: italic; }
    .error { color: #d32f2f; }
