# Portal nginx: static landing page + same-origin news proxies.
# - /news /events /hrz /ub  proxy the uni-marburg.de Atom feeds
#   server-side (no CORS, no third-party proxy, behind oauth2-proxy auth)
# - /me                      echoes the authenticated user name injected by
#                            oauth2-proxy (--set-xauthrequest)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 172.17.192.10 valid=30s;   # kube-dns ClusterIP (external upstreams)

    # shared settings for external upstreams (SNI + headers)
    proxy_set_header Host www.uni-marburg.de;
    proxy_set_header User-Agent "Mozilla/5.0 (compatible; OpenDeskPortal/1.0)";
    proxy_ssl_server_name on;
    proxy_ssl_name www.uni-marburg.de;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;

    # oauth2-proxy forwards unauthenticated probes
    location = /ping {
        access_log off;
        default_type text/plain;
        return 200 "pong";
    }
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # user greeting is fetched client-side from oauth2-proxy /oauth2/userinfo

    # ---- uni-marburg.de Atom feeds (Plone), proxied server-side ----

    # ---- uni-marburg.de Atom feeds (Plone), proxied server-side ----
    location = /news {
        proxy_pass https://www.uni-marburg.de/de/aktuelles/news/atom.xml;
    }
    location = /events {
        proxy_pass https://www.uni-marburg.de/de/aktuelles/events/atom.xml;
    }
    location = /hrz {
        proxy_pass https://www.uni-marburg.de/de/hrz/aktuelles/nachrichten/atom.xml;
    }
    location = /ub {
        proxy_pass https://www.uni-marburg.de/de/ub/aktuelles/nachrichten/atom.xml;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
